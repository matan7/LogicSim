name: CI

on:
  push:
  pull_request:

jobs:
  headless:
    name: Simulation core, MCP server and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Headless/LogicSim.Headless.sln -c Release
      - name: Test (same NUnit tests as Unity's Test Runner)
        run: dotnet test Headless/LogicSim.Headless.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Benchmark (managed backend)
        run: dotnet run --project Headless/LogicSim.Benchmark -c Release --no-build
